name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # Zero runtime dependencies: the test suite needs no npm install.
      - name: Lint installer scripts
        run: bash -n install.sh uninstall.sh && python3 -m py_compile install.py
      - run: npm test
      - name: Smoke test (server boots and /api/health responds)
        run: |
          PORT=3100 node server.js &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health >/dev/null; then ok=1; break; fi
            sleep 0.2
          done
          kill $pid || true
          test "$ok" = "1"
