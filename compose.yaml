services:
  panel:
    build: .
    image: dockbase-panel:latest
    container_name: dockbase-panel
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the panel container the server always listens on 3000.
      PORT: 3000
    ports:
      - "${PANEL_PORT:-3000}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - panel-config:/app/state
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  panel-config:
    name: dockbase-panel-config
    labels:
      - database-panel.managed=true
